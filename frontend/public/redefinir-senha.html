<!doctype html>
<html lang="pt-BR">
<head>
  <title>Redefinir senha - Campeonatos Escolares</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <div id="topo"></div>

  <main class="container py-5" style="max-width: 480px;">
    <div id="conteudo">
      <div class="sobrancelha">Aluno</div>
      <h1 class="mb-3">Redefinir senha</h1>

      <div id="passo-formulario">
        <div class="mb-3">
          <label class="form-label" for="nova-senha">Nova senha</label>
          <input class="form-control" id="nova-senha" type="password" autocomplete="new-password">
          <div class="form-text">Mínimo de 6 caracteres.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmar-nova-senha">Confirmar senha</label>
          <input class="form-control" id="confirmar-nova-senha" type="password" autocomplete="new-password">
        </div>
        <button class="btn btn-primary w-100" id="btn-redefinir">Redefinir e entrar</button>
      </div>

      <div class="d-none text-center" id="passo-invalido">
        <div class="vazio">
          <strong>Não foi possível redefinir</strong>
          <span id="texto-invalido"></span>
        </div>
        <a class="btn btn-primary mt-3" href="login.html">Ir para o login</a>
      </div>

      <div class="d-none text-center" id="passo-sucesso">
        <div class="check-animado"><svg class="icone" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
        <h2 class="h5 mb-2">Senha redefinida!</h2>
        <p class="text-muted">Redirecionando para o seu painel...</p>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/redefinir-senha.js"></script>
</body>
</html>
