<!doctype html>
<html lang="pt-BR">
<head>
  <title>Campeonato</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <div id="topo"></div>

  <main class="container py-4">
    <div id="cabecalho" class="mb-4"></div>

    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#aba-jogos" type="button">Jogos</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#aba-classificacao" type="button">Classificacao</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#aba-artilheiros" type="button">Artilheiros</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="aba-jogos"></div>
      <div class="tab-pane fade" id="aba-classificacao"></div>
      <div class="tab-pane fade" id="aba-artilheiros"></div>
    </div>
  </main>

  <footer class="container rodape">Pagina aberta: qualquer pessoa com o link acompanha o campeonato.</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/publico.js"></script>
</body>
</html>
