<!doctype html>
<html lang="pt-BR">
<head>
  <title>Alunos - Coordenação</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <div id="topo"></div>

  <main class="container py-4" style="max-width: 760px;">
    <div class="sobrancelha">Coordenação</div>
    <h1 class="mb-1">Alunos</h1>
    <p class="text-muted">
      Cada aluno cria a própria conta com o e-mail institucional
      (@aluno.farroupilha.ifrs.edu.br) na tela de login.
    </p>

    <section class="cartao">
      <div class="cartao-cabecalho">
        <h2 class="h6 mb-0">Lista</h2>
        <span class="sobrancelha" id="contagem-alunos"></span>
      </div>
      <div class="cartao-corpo" id="lista-alunos"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/alunos-admin.js"></script>
</body>
</html>
