<!doctype html>
<html lang="pt-BR">
<head>
  <title>Campeonatos Escolares</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="img/ifrs-marca.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <div id="topo"></div>

  <main class="container py-4">
    <section class="capa mb-4">
      <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
        <div>
          <div class="sobrancelha">Educação física &middot; Campus Farroupilha</div>
          <h1 class="mb-1">Campeonatos da escola<span class="ponto">.</span></h1>
          <p class="mb-0">Tabela, classificação e artilheiros atualizados a cada placar lançado.</p>
        </div>
        <button class="btn btn-primary btn-lg" id="btn-novo">Criar campeonato</button>
      </div>
      <div class="capa-numeros" id="capa-numeros"></div>
    </section>

    <div id="lista" class="row g-3"></div>
  </main>

  <footer class="container rodape">
    Sistema de organização de campeonatos esportivos escolares.
  </footer>

  <div class="modal fade" id="modal-campeonato" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="titulo-modal">Novo campeonato</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="c-nome">Nome</label>
            <input class="form-control" id="c-nome" placeholder="Interclasses de Futsal 2026">
          </div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label" for="c-modalidade">Modalidade</label>
              <input class="form-control" id="c-modalidade" list="modalidades" placeholder="Futsal">
              <datalist id="modalidades">
                <option>Futsal</option><option>Vôlei</option><option>Handebol</option>
                <option>Basquete</option><option>Futebol</option><option>Queimada</option>
              </datalist>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="c-formato">Formato</label>
              <select class="form-select" id="c-formato">
                <option value="pontos_corridos">Pontos corridos</option>
                <option value="mata_mata">Mata-mata</option>
                <option value="grupos_mata_mata">Grupos + mata-mata</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="c-inicio">Começa em</label>
              <input type="date" class="form-control" id="c-inicio">
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="c-fim">Termina em</label>
              <input type="date" class="form-control" id="c-fim">
            </div>
            <div class="col-12" id="linha-turno">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="c-returno">
                <label class="form-check-label" for="c-returno">Jogar turno e returno (ida e volta)</label>
              </div>
            </div>
            <div class="col-sm-6 d-none" id="linha-tamanho">
              <label class="form-label" for="c-tamanho">Times por grupo</label>
              <input type="number" class="form-control" id="c-tamanho" value="4" min="3" max="8">
            </div>
            <div class="col-sm-6 d-none" id="linha-classificados">
              <label class="form-label" for="c-classificados">Classificados por grupo</label>
              <input type="number" class="form-control" id="c-classificados" value="2" min="1" max="7">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" id="btn-salvar-campeonato">Criar campeonato</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
