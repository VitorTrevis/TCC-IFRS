<!doctype html>
<html lang="pt-BR">
<head>
  <title>Historico - Coordenacao</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="img/ifrs-marca.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <div id="topo"></div>

  <main class="container py-4" style="max-width: 760px;">
    <div class="sobrancelha">Coordenacao</div>
    <h1 class="mb-1">Historico</h1>
    <p class="text-muted">
      Quem criou, editou ou excluiu campeonatos, times, jogadores e placares —
      e quando. A senha da coordenacao e unica, entao isso e o que identifica
      quem fez cada alteracao.
    </p>

    <section class="cartao">
      <div class="cartao-cabecalho">
        <h2 class="h6 mb-0">Ultimas alteracoes</h2>
        <span class="sobrancelha" id="contagem-historico"></span>
      </div>
      <div class="cartao-corpo" id="lista-historico">Carregando...</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/historico.js"></script>
</body>
</html>
